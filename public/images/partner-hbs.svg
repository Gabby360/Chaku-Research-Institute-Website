<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <g transform="translate(10, 15)">
    <!-- Veritas Shield -->
    <path d="M 20 10 L 110 10 L 110 80 C 110 120 65 145 65 145 C 65 145 20 120 20 80 Z" fill="#A51C30" stroke="#7A0016" stroke-width="2"/>
    <!-- Top banner with books -->
    <rect x="25" y="15" width="80" height="42" fill="#A51C30"/>
    <!-- 3 Books -->
    <!-- Book 1 -->
    <rect x="30" y="20" width="22" height="15" fill="#FFFFFF" rx="1"/>
    <text x="41" y="31" font-family="Georgia, serif" font-weight="bold" font-size="9" fill="#A51C30" text-anchor="middle">VE</text>
    <!-- Book 2 -->
    <rect x="54" y="20" width="22" height="15" fill="#FFFFFF" rx="1"/>
    <text x="65" y="31" font-family="Georgia, serif" font-weight="bold" font-size="9" fill="#A51C30" text-anchor="middle">RI</text>
    <!-- Book 3 -->
    <rect x="78" y="20" width="22" height="15" fill="#FFFFFF" rx="1"/>
    <text x="89" y="31" font-family="Georgia, serif" font-weight="bold" font-size="9" fill="#A51C30" text-anchor="middle">TAS</text>
    
    <!-- Lower Shield (Black background with white leaves/stars) -->
    <path d="M 25 58 L 105 58 L 105 80 C 105 115 65 138 65 138 C 65 138 25 115 25 80 Z" fill="#111111"/>
    <!-- Starburst / Cross elements -->
    <g fill="#FFFFFF">
      <circle cx="65" cy="80" r="4"/>
      <circle cx="45" cy="72" r="3"/>
      <circle cx="85" cy="72" r="3"/>
      <circle cx="50" cy="98" r="3"/>
      <circle cx="80" cy="98" r="3"/>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="155" y1="35" x2="155" y2="145" stroke="#A51C30" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Text: HARVARD BUSINESS SCHOOL -->
  <text x="180" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#111111" letter-spacing="2.5">HARVARD</text>
  <text x="180" y="125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#111111" letter-spacing="2">BUSINESS SCHOOL</text>
</svg>
