<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<textarea id="data" style="width:100%;height:300px;"></textarea>
<script>
const img = new Image();
img.src = '/images/chaku-logo-light.png';
img.onload = () => {
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = 280;
  cropCanvas.height = 280;
  const cctx = cropCanvas.getContext('2d');
  cctx.drawImage(img, 260, 0, 280, 280, 0, 0, 280, 280);
  
  const cData = cctx.getImageData(0, 0, 280, 280);
  for (let i = 0; i < cData.data.length; i += 4) {
    const r = cData.data[i];
    const g = cData.data[i+1];
    const b = cData.data[i+2];
    if (r > 220 && g > 220 && b > 220) {
      cData.data[i+3] = 0; // transparent
    }
  }
  cctx.putImageData(cData, 0, 0);
  const dataUrl = cropCanvas.toDataURL('image/png');
  document.getElementById('data').value = dataUrl;
  console.log("DATA_URL_READY");
};
</script>
</body>
</html>
